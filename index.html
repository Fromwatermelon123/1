<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銷售資料儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
 body{font-family:system-ui,"Microsoft JhengHei",sans-serif;margin:0;padding:16px;background:#f4f6f8;color:#222}
 h1{font-size:20px;margin:0 0 4px} .sub{color:#555;margin-bottom:12px}
 .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
 .k{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px #0002}.k b{display:block;font-size:20px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
 .c{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px #0002}
 button{padding:6px 12px;margin-left:8px} #err{color:#b00020}
</style>
</head>
<body>
<h1>銷售資料儀表板 <button onclick="load()">重新載入</button></h1>
<div class="sub">目前資料集:<b id="ds">載入中…</b> <span id="err"></span></div>
<div class="kpi" id="kpi"></div>
<div class="grid">
 <div class="c"><canvas id="c1"></canvas></div>
 <div class="c"><canvas id="c2"></canvas></div>
 <div class="c"><canvas id="c3"></canvas></div>
 <div class="c"><canvas id="c4"></canvas></div>
 <div class="c"><canvas id="c5"></canvas></div>
</div>
<script>
// ★ 部署 Vercel 後,把網址貼在這裡,例如 https://my-sales-api.vercel.app/api/sales
const API_URL = "https://sales-dashboard-water.vercel.app/api/sales";

const charts = {};
const sum = (rows, key) => { const m = {}; rows.forEach(r => m[r[key]] = (m[r[key]]||0) + r.net); return m; };
function draw(id, type, labels, data, title, extra={}) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type, data: {labels, datasets:[{label:title, data, ...extra}]},
    options:{plugins:{title:{display:true,text:title}, legend:{display:type==='pie'}}}
  });
}
async function load() {
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const res = await fetch(API_URL, {cache:'no-store'});
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    rows.forEach(r => r.net = r.unit_price * (r.quantity - r.returned_quantity));
    const rec = rows.length, qty = rows.reduce((a,r)=>a+r.quantity,0),
          ret = rows.reduce((a,r)=>a+r.returned_quantity,0), net = rows.reduce((a,r)=>a+r.net,0);
    document.getElementById('ds').textContent =
      net===3217100 ? 'sales_original_300' : net===3970100 ? 'sales_updated_300' : '未知資料集';
    document.getElementById('kpi').innerHTML =
      [['筆數',rec],['售出數量',qty],['退貨數量',ret],['淨銷售額 (NT$)',net.toLocaleString()]]
      .map(([t,v])=>`<div class="k">${t}<b>${v}</b></div>`).join('');
    const d = sum(rows,'sale_date'), p = sum(rows,'product_name'), c = sum(rows,'category'), h = sum(rows,'channel');
    draw('c1','line',Object.keys(d).sort(),Object.keys(d).sort().map(k=>d[k]),'每日淨銷售額',{borderColor:'#2563eb',tension:.2});
    draw('c2','bar',Object.keys(p),Object.values(p),'各商品淨銷售額',{backgroundColor:'#16a34a'});
    draw('c3','pie',Object.keys(c),Object.values(c),'各分類淨銷售額占比',{backgroundColor:['#2563eb','#f59e0b','#16a34a']});
    draw('c4','bar',Object.keys(h),Object.values(h),'通路比較',{backgroundColor:'#9333ea'});
    draw('c5','scatter',null,rows.map(r=>({x:r.quantity,y:r.net})),'售出數量 vs 淨銷售額',{backgroundColor:'#dc2626'});
  } catch (e) {
    err.textContent = '無法取得資料(檢查 API_URL 與 Vercel 環境變數):' + e.message;
  }
}
load();
</script>
</body>
</html>
